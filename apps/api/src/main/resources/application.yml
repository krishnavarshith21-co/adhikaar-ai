server:
  port: 8080

spring:
  application:
    name: adhikaar-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/adhikaar}
    username: ${DB_USERNAME:adhikaar}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
