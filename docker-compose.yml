services:
  postgres:
    image: postgres:16-alpine
    container_name: adhikaar-postgres
    environment:
      POSTGRES_DB: adhikaar
      POSTGRES_USER: adhikaar
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adhikaar -d adhikaar"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adhikaar-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/adhikaar
      DB_USERNAME: adhikaar
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

